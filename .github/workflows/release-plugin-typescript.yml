name: Release TypeScript Plugin

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Semantic version for the plugin release (e.g. 1.0.0). The 'plugin-typescript-v' prefix is added automatically."
        required: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Validate version and compute tag
        id: compute
        env:
          VERSION: ${{ github.event.inputs.tag }}
        run: |
          PREFIX="plugin-typescript-v"
          # Back-compat: accept the full tag form (e.g. plugin-typescript-v1.0.4) too, not
          # just the bare version. DO NOT REMOVE: old forks pass the full tag when releasing.
          VERSION="${VERSION#"$PREFIX"}"
          # Tolerate a bare "v" prefix (e.g. v1.0.4) so the tag isn't doubled below.
          VERSION="${VERSION#v}"
          # Validate via the shared script (same semver check as the auto-updater).
          go run ./cmd/scripts/semver "$VERSION"
          echo "tag=${PREFIX}${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version '$VERSION' is valid. Release tag: ${PREFIX}${VERSION}"

  release:
    name: Build and Release TypeScript Plugin
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: plugin/typescript
        run: npm ci

      - name: Build plugin
        working-directory: plugin/typescript
        run: npm run build:all

      - name: Install production dependencies only
        working-directory: plugin/typescript
        run: |
          rm -rf node_modules
          npm ci --production

      - name: Create distribution tarball
        working-directory: plugin/typescript
        run: |
          mkdir -p release
          # Create tarball with dist/, node_modules, package.json (for "type": "module"),
          # AND proto/ — the raw .proto schema files are loaded at runtime by
          # protobufjs.loadSync() from the compiled dist/contract/*.js. Without
          # proto/ in the tarball, plugins that build with the canonical tutorial
          # pattern crash on startup with ENOENT (see canopy-network/canopy#<TODO>).
          # If a chain author has no proto/ directory, fall back to the legacy
          # tarball shape so their build doesn't break.
          #
          # Note: pluginctl.sh is NOT included - it's copied separately by Dockerfile
          # and we don't want old releases to overwrite newer pluginctl.sh versions
          if [ -d proto ]; then
            tar -czf release/typescript-plugin.tar.gz dist/ node_modules/ package.json proto/
          else
            tar -czf release/typescript-plugin.tar.gz dist/ node_modules/ package.json
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: "TypeScript Plugin ${{ needs.validate.outputs.tag }}"
          body: |
            TypeScript Plugin Release ${{ needs.validate.outputs.tag }}
            
            ## Installation
            1. Extract `typescript-plugin.tar.gz` to `plugin/typescript/`
            2. The plugin is ready to run (node_modules included)
            
            ## Assets
            - `typescript-plugin.tar.gz` - Compiled plugin with dependencies
          files: |
            plugin/typescript/release/typescript-plugin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
