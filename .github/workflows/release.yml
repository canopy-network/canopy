          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare tags
        id: prep
        run: |
          TAG=${{ github.event.inputs.tag }}
          DOCKER_TAG=${TAG//+/-}
          echo "docker_tag=${DOCKER_TAG}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
