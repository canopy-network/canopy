name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Semantic version for the release (e.g. 1.0.0). The 'v' prefix is added automatically."
        required: true

permissions:
  contents: write

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Validate version and compute tag
        id: compute
        env:
          VERSION: ${{ github.event.inputs.tag }}
        run: |
          # Tolerate a leading "v" (e.g. v1.0.0) so the tag isn't doubled into "vv1.0.0".
          VERSION="${VERSION#v}"
          # Validate via the shared script (same semver check as the auto-updater).
          go run ./cmd/scripts/semver "$VERSION"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version '$VERSION' is valid. Release tag: v${VERSION}"

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build binaries
        run: |
          make build/wallet
          make build/explorer
          mkdir -p dist
          GOARCH=amd64 CGO_ENABLED=0 GOOS=linux go build -a -o dist/cli-linux-amd64 ./cmd/main/...
          GOARCH=arm64 CGO_ENABLED=0 GOOS=linux go build -a -o dist/cli-linux-arm64 ./cmd/main/...
          GOARCH=arm64 CGO_ENABLED=0 GOOS=darwin go build -a -o dist/cli-darwin-arm64 ./cmd/main/...
          GOARCH=amd64 CGO_ENABLED=0 GOOS=linux go build -a -o dist/signer-linux-amd64 ./cmd/signer/...
          GOARCH=arm64 CGO_ENABLED=0 GOOS=linux go build -a -o dist/signer-linux-arm64 ./cmd/signer/...
          GOARCH=arm64 CGO_ENABLED=0 GOOS=darwin go build -a -o dist/signer-darwin-arm64 ./cmd/signer/...
          (
            cd plugin/go
            GOARCH=amd64 CGO_ENABLED=0 GOOS=linux go build -a -o ../../dist/go-plugin .
            tar -czf ../../dist/go-plugin-linux-amd64.tar.gz -C ../../dist go-plugin
            rm ../../dist/go-plugin
            GOARCH=arm64 CGO_ENABLED=0 GOOS=linux go build -a -o ../../dist/go-plugin .
            tar -czf ../../dist/go-plugin-linux-arm64.tar.gz -C ../../dist go-plugin
            rm ../../dist/go-plugin
          )
          sha256sum dist/cli-* dist/signer-* dist/go-plugin-* > dist/SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/cli-linux-amd64
            dist/cli-linux-arm64
            dist/cli-darwin-arm64
            dist/signer-linux-amd64
            dist/signer-linux-arm64
            dist/signer-darwin-arm64
            dist/go-plugin-linux-amd64.tar.gz
            dist/go-plugin-linux-arm64.tar.gz
            dist/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-main:
    name: Docker - Main
    runs-on: ubuntu-latest
    needs: [validate, release]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Prepare tags
        id: prep
        run: |
          TAG=${{ needs.validate.outputs.tag }}
          DOCKER_TAG=${TAG//+/-}
          echo "docker_tag=${DOCKER_TAG}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./.docker/auto-update/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            canopynetwork/canopy:${{ steps.prep.outputs.docker_tag }}
            canopynetwork/canopy:latest
          build-args: |
            BRANCH=${{ github.event.inputs.tag }}
            BUILD_PATH=cmd/cli

  docker-go:
    name: Docker - Go Plugin
    runs-on: ubuntu-latest
