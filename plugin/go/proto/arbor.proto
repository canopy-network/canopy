syntax = "proto3";
package types;

option go_package = "github.com/ARBOR-L/ARBOR/plugin/go/contract";

// ─────────────────────────────────────────────
// Market lifecycle
// ─────────────────────────────────────────────

// MessageCreateMarket creates a new isolated lending market (ARCM §3, §19.2)
message MessageCreateMarket {
  string market_id = 1;
  string collateral_asset_id = 2;
  string debt_asset_id = 3;
  uint32 asset_tier = 4;           // 0-4, ARCM §4 LTV table
  uint64 reserve_factor_bps = 5;   // 200-3000 bps, AYIS §13
  bytes  creator = 6;
  repeated bytes authorized_submitters = 7; // ARCM §10 permissioned price feed;
                                             // trusted addresses for update_price on
                                             // this market's two assets (shared list,
                                             // not per-asset). Immutable as of this
                                             // version -- no governance-gated
                                             // add/remove path exists yet. Must satisfy
                                             // MinReporters (hardcoded 3, mirrors
                                             // interest_rate.go's precedent of
                                             // hardcoding pending {22}'s governance
                                             // param store, which does not exist yet).
}

// MessageUpdateMarketParams updates governance-bounded per-market params (ARCM §13, §15)
message MessageUpdateMarketParams {
  string market_id = 1;
  bytes  authority = 2;
  uint64 reserve_factor_bps = 3;
}

// MessagePauseMarket halts a market via governance/risk-committee action (ARCM §13, §16)
message MessagePauseMarket {
  string market_id = 1;
  bytes  authority = 2;
}

// MessageResumeMarket resumes a paused market
message MessageResumeMarket {
  string market_id = 1;
  bytes  authority = 2;
}

// MessageDeprecateMarket permanently retires a market
message MessageDeprecateMarket {
  string market_id = 1;
  bytes  authority = 2;
}

// ─────────────────────────────────────────────
// Oracle (ARCM §10)
// ─────────────────────────────────────────────

// MessageUpdatePrice submits a permissioned price feed reading
message MessageUpdatePrice {
  string asset_id = 1;             // must match this market's collateral_asset_id
                                    // or debt_asset_id (checked at DeliverTx)
  uint64 price = 2;                // USD per unit, x1e8
  uint32 confidence_bps = 3;
  bytes  submitter = 4;
  string market_id = 5;            // scopes this submission to one market's
                                    // authorized_submitters list (ARCM Section
                                    // 10 is a PER-MARKET permissioned feed, not
                                    // a global asset-price authority -- added
                                    // to avoid an unbounded PrefixMarkets scan
                                    // to reverse-lookup market from asset_id)
}

// ─────────────────────────────────────────────
// Collateral (borrower side, ARCM §6)
// ─────────────────────────────────────────────

// MessageDepositCollateral posts collateral against a borrower position
message MessageDepositCollateral {
  string market_id = 1;
  bytes  address = 2;
  uint64 quantity = 3;             // native units, 9-decimal convention (ARCM §2.1a)
}

// MessageWithdrawCollateral removes collateral, subject to post-withdrawal HF check
message MessageWithdrawCollateral {
  string market_id = 1;
  bytes  address = 2;
  uint64 quantity = 3;
}

// ─────────────────────────────────────────────
// Supply / lending side (AYIS §4)
// ─────────────────────────────────────────────

// MessageDeposit supplies the market's asset in exchange for aToken shares (AYIS MintShares)
message MessageDeposit {
  string market_id = 1;
  bytes  address = 2;
  uint64 amount = 3;                // native asset units
}

// MessageWithdraw redeems aToken shares for the underlying asset (AYIS RedeemShares)
message MessageWithdraw {
  string market_id = 1;
  bytes  address = 2;
  uint64 shares = 3;                 // aToken shares, not underlying amount
}

// ─────────────────────────────────────────────
// Borrow / repay (ARCM §6, §19.2.1)
// ─────────────────────────────────────────────

// MessageBorrow opens or increases a borrow position against posted collateral
message MessageBorrow {
  string market_id = 1;
  bytes  address = 2;
  uint64 borrow_amount = 3;
}

// MessageRepay reduces or closes a borrow position
message MessageRepay {
  string market_id = 1;
  bytes  address = 2;
  uint64 repay_amount = 3;
}

// ─────────────────────────────────────────────
// Liquidation (ARCM §6, §19.2.2)
// ─────────────────────────────────────────────

// MessageLiquidatePosition liquidates an undercollateralized borrower position
message MessageLiquidatePosition {
  string market_id = 1;
  bytes  liquidator = 2;
  bytes  borrower_address = 3;
  uint64 repay_amount = 4;           // capped at debt x close_factor, ARCM §7
}

// ─────────────────────────────────────────────
// Asset tier registry (ARCM §3.1/§3.2)
// ─────────────────────────────────────────────

// MessageSetAssetTier registers or updates an asset's canonical risk tier
// (0=Tier0/CNPY .. 3=Tier3/Restricted; Tier 4/Blacklisted is never stored,
// see state_keys.go PrefixAssetTier). Authority-gated -- single hardcoded
// address for now, standing in for the risk-committee multisig ARCM §13
// names as the intended actor for tier promotion/demotion; same disclosed-
// placeholder pattern as authorized_submitters above. Real governance-gated
// multisig/timelock is a future milestone, not implemented here.
message MessageSetAssetTier {
  string asset_id = 1;
  uint32 tier = 2;                 // 0-3 only; checked at DeliverTx
  bytes  authority = 3;
}

// MessageSetTreasuryCut sets the GLOBAL treasury_cut_bps governance parameter
// (see bad_debt_layer3.go's own doc comment on PrefixTreasuryArbor/
// PrefixTreasuryNASM being global, not per-market -- this parameter mirrors
// that scope). Unlike reserve_factor_bps (per-market, set via create_market/
// update_market_params), treasury_cut_bps applies uniformly to every
// market's interest accrual (AYIS Section 7 Step 10, extended): a single
// governance-set rate feeds Arbor's own protocol treasury ({40}) from every
// market's interest_earned, rather than each market creator choosing (and
// potentially free-riding by setting to 0) their own contribution to a
// shared, protocol-wide backstop. Bounds: 25-150 bps (0.25%-1.5%),
// deliberately narrower than reserve_factor_bps's 200-3000 -- Layer 3 (this
// treasury) is a secondary, lower-probability-of-use backstop behind Layer
// 2's per-market reserve, not a primary defense, so it should not tax lender
// yield as heavily. Floor raised from an initially-considered 10 bps: Layer
// 3 only fires after a market's OWN R_fund is already exhausted by a single
// shortfall, implying a real bad-debt event large enough to matter; too low
// a floor risks the treasury accumulating too slowly to ever meaningfully
// help, the same "looks wired but silently doesn't matter" failure mode
// this codebase's own discipline elsewhere exists to avoid. No market_id
// field -- this is a single global value, analogous to
// KeyForTreasuryArbor/KeyForTreasuryNASM's own no-argument, global-balance
// shape (state_keys.go).
message MessageSetTreasuryCut {
  bytes  authority = 1;
  uint64 treasury_cut_bps = 2; // 25-150 bps, checked at DeliverTx
}
