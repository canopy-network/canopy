syntax = "proto3";
package types;

option go_package = "github.com/ARBOR-L/ARBOR/plugin/go/contract";

// MarketStatus mirrors ARCM's market.status enum (Section 9, Section 13, Section 16).
enum MarketStatus {
  ACTIVE = 0;
  PAUSED = 1;      // governance action (ARCM Section 13)
  INSOLVENT = 2;   // loss_factor reached zero (AYIS Section 5.4.3, I11)
  DEPRECATED = 3;  // permanently retired (ARCM Section 19.2)
}

// Market is the {16} record: core market metadata plus the flags and counters
// ARCM's bad-debt waterfall and freeze mechanism operate on. See ARCM v3.11.1
// Section 19.1 for the canonical field set this implements.
message Market {
  string market_id = 1;
  string collateral_asset_id = 2;
  string debt_asset_id = 3;
  uint32 asset_tier = 4;                    // 0-4, ARCM Section 4 LTV table
  uint64 reserve_factor_bps = 5;            // AYIS Section 13
  bytes  creator = 6;

  MarketStatus status = 7;
  bool   index_overflow_halted = 8;         // ARCM Section 9.3a

  uint32 layer4_pending_count = 9;          // ARCM Section 9.2b
  bytes  layer4_pending_bad_debt_total = 10; // uint128, EncodeUint128 raw bytes (widened v3.11, L2-widen)

  uint64 total_borrowed = 11;               // guarded via applyDebtDelta, C1
  uint64 total_supplied = 12;               // ARCM Section 19.2.1b

  uint64 last_accrual_block = 13;           // AYIS Section 7 Step 11

  repeated bytes authorized_submitters = 14; // ARCM Section 10 permissioned
                                              // price feed; trusted addresses
                                              // for update_price on this
                                              // market's two assets (shared
                                              // list). Set once at
                                              // create_market, immutable --
                                              // no governance add/remove path
                                              // exists yet.

  // interest_remainder_ray is a RAY-scaled (1e18) fractional carry, uint128
  // raw bytes via EncodeUint128/DecodeUint128 (matching layer4_pending_bad_debt_total's
  // own encoding convention). AYIS Section 7 Step 7's interest_earned
  // computation floor-divides by RAY; without this field, any block where
  // total_borrowed * per_block_rate * delta_t doesn't clear one full RAY unit
  // has that fractional interest silently discarded rather than carried
  // forward -- a real, disclosed accounting-loss bug (found while live-testing
  // treasury_cut on a small devnet market), not merely a test-scale artifact.
  // Always < RAY in magnitude after every accrual by construction (the
  // remainder of a division by RAY can never reach RAY itself), so encoding
  // it can never overflow 128 bits.
  bytes interest_remainder_ray = 15;
}

// BorrowerPosition is the {17} record (ARCM Section 6, AYIS Section 6).
message BorrowerPosition {
  string market_id = 1;
  bytes  address = 2;
  uint64 collateral_quantity = 3;
  uint64 debt_principal = 4;
  bytes  borrow_index_at_open = 5;  // uint128, EncodeUint128 raw bytes -- B_index snapshot at open
}

// PriceRecord is one {19} entry, keyed by (asset_id, submitter) --
// ARCM Section 10's permissioned price feed. Multiple independent
// submitters each write their own record per asset; quorum (MIN_REPORTERS)
// and deviation (30% circuit breaker) are resolved by aggregating across
// all of an asset's records at READ time, not by any single record being
// authoritative on its own. block_height is chain-assigned at write time
// (not submitter-supplied) for Section 11's staleness checks.
message PriceRecord {
  string asset_id = 1;
  bytes  submitter = 2;
  uint64 price = 3;          // USD per unit, x1e8
  uint32 confidence_bps = 4;
  uint64 block_height = 5;
}

// LenderPosition is the {24} record (AYIS Section 5.1).
message LenderPosition {
  string market_id = 1;
  bytes  address = 2;
  uint64 shares = 3;
  uint64 deposit_block = 4;
}

// LossFactorQueueEntry is a {28} record (AYIS Section 12.4, ARCM v3.11.1
// Section 9.3b Rule 3). One entry per market_id: a backstop-triggered
// Layer 4 exhaustion enqueues a bad_debt amount here (via
// EnqueueLossFactorApplication) rather than calling ApplyLossFactor()
// synchronously, so BeginBlock's ProcessLossFactorQueue() can drain it
// later in the same call under Section 12.3's Accrual Ordering Contract
// (AccrueInterest MUST run before this queue drains). A market has at
// most one outstanding entry at a time -- K3's idempotency guard in
// ApplyLossFactor() means a second enqueue against an already-Insolvent
// market is a no-op at drain time, not a second queued entry, so this
// message does not need its own sequence/ordering field.
message LossFactorQueueEntry {
  string market_id = 1;
  uint64 bad_debt = 2;
  uint64 enqueued_block = 3;  // observability only; not read by any
                              // drain-order logic (drain order is
                              // unspecified/immaterial per AYIS 5.4.3,
                              // MAX_LOSS_FACTOR_APPLICATIONS_PER_BLOCK
                              // bounds work per block, not by age)
}

// GovernanceParams is the {22} record: a single global struct holding
// protocol-wide governance-set values that are NOT scoped to any individual
// market (unlike reserve_factor_bps, which lives on Market itself and is
// set per-market via update_market_params). PrefixGovernanceParams was
// reserved at ARCM v3.11.1 Section 19.1 with no field schema ever defined
// or implemented; treasury_cut_bps (added this session) is the first real
// use of this prefix. Stored as ONE encoded struct under KeyForGovernanceParams
// (matching Market's single-struct-per-key convention, not one state key
// per field), so that future global governance parameters are added as new
// fields on this same message rather than each minting its own top-level
// state-key prefix. A DeliverTx handler adding a new parameter must
// read-modify-write the whole struct via GetGovernanceParams/
// SaveGovernanceParams, exactly as market parameter updates read-modify-write
// the whole Market struct.
message GovernanceParams {
  // treasury_cut_bps: global bps of interest_earned routed to Arbor's own
  // protocol treasury ({40}, PrefixTreasuryArbor) on every market's accrual
  // (AYIS Section 7 Step 10, extended -- see MessageSetTreasuryCut in
  // arbor.proto for the full rationale and bounds). Zero-value default
  // (before governance ever calls set_treasury_cut) is 0, matching
  // PrefixTreasuryArbor/PrefixReserveFund's own zero-init-safe convention --
  // Layer 3 simply accumulates nothing until this is explicitly set.
  uint64 treasury_cut_bps = 1;
}

// ─────────────────────────────────────────────
// NASM (NUSD / Arbor Stability Module) messages -- see NASM Consolidated
// Specification for full design rationale. State keys {30}, {31}, {32},
// {34} (state_keys.go); {33} is deliberately unused, R_nusd lives at {41}
// (PrefixTreasuryNASM), already implemented ahead of this NASM work as
// part of the earlier Treasury-split reversal.
// ─────────────────────────────────────────────

// NasmVault is the {30} record: a single NUSD-backing collateral position.
// Keyed by vault_id (a caller-supplied string, validated via
// ValidateVaultID) -- NOT by owner address, unlike BorrowerPosition's
// (market_id, address) composite key. This is deliberate: NASM Spec
// Section 5.2 requires vault ownership to be "a transferable claim, not a
// bound identity" (the arbitrage loop's second leg is buying a vault
// position outright on the secondary market). owner is therefore a mutable
// field on the record itself, not baked into the key.
message NasmVault {
  string vault_id = 1;
  bytes  owner = 2;                  // current vault owner; mutable, unlike BorrowerPosition.address
  string collateral_asset_id = 3;    // must be NASM Tier N-0 or N-1, checked against a NASM-specific
                                      // tier table, NOT ARCM's Market.asset_tier / PrefixAssetTier
  uint64 collateral_quantity = 4;    // matches BorrowerPosition.collateral_quantity's uint64 convention
  uint64 nusd_principal = 5;         // raw minted principal, BEFORE stability fee scaling --
                                      // callers MUST read debt via ScaledNusdDebt(), never this field
                                      // directly (NASM Spec Section 6.3)
  bytes  sf_index_at_open = 6;       // uint128 RAY-scaled SF_index(t) snapshot, EncodeUint128 raw bytes --
                                      // same shape as BorrowerPosition.borrow_index_at_open
  uint32 nasm_tier = 7;              // the NASM tier (0=N-0, 1=N-1) this vault was minted into, per
                                      // ResolveNasmTier's own return value at mint_nusd time. Snapshotted
                                      // here, NOT re-resolved live at burn/liquidate time, deliberately --
                                      // same reasoning as sf_index_at_open's own snapshot-not-live-read
                                      // convention above: NASM Spec Section 3.3's per-tier concentration
                                      // accumulator (NasmTierBacking, {36}) must decrement the SAME tier
                                      // a vault's principal was originally counted against, even if the
                                      // underlying asset is later reclassified at ARCM's {29} registry --
                                      // re-resolving live would let a vault's principal permanently
                                      // overstate one tier's accumulator forever if the asset is ever
                                      // downgraded out of Tier 0/1 after mint, the exact silent-drift
                                      // failure class this accumulator exists to prevent in the first
                                      // place (see mint_nusd.go's own original disclosed-gap comment).
                                      // Proto type is uint32 (not uint8 -- protobuf has no uint8 scalar);
                                      // Go-side accessors treat this as uint8 throughout, matching
                                      // ResolveNasmTier's own return type.
}

// NusdSupply is the {31} record: the single global NUSD circulating supply
// counter. No-argument key (KeyForNusdSupply), matching GovernanceParams'
// single-global-struct convention -- one record, read-modify-write per
// change, not one state key per field.
message NusdSupply {
  uint64 total_supply = 1;  // 1e6 precision (NASM Spec Section 2.3), plain uint64 --
                             // matches BorrowerPosition/LenderPosition's amount-field convention,
                             // not the RAY-scaled bytes convention (this is a token amount, not an index)
}

// NasmTierBacking is the {36} record: NASM Spec Section 3.3's per-tier mint
// concentration cap accumulator. Deliberately deferred at mint_nusd's own
// original implementation ("requires a running total-backing-value
// accumulator per tier that does not exist in state yet... deferred until
// burn_nusd exists, so the accumulator can be built correctly in sync on
// both mint AND burn from the start") -- burn_nusd now exists, closing that
// dependency.
//
// Two explicit named fields, not a repeated/map structure -- matches this
// codebase's established preference for explicit typed fields over generic
// collections at small, fixed cardinality (see PrefixTreasuryArbor/
// PrefixTreasuryNASM's identical two-named-field split over one
// parameterized pool). NASM has exactly two eligible tiers (N-0, N-1;
// N-2/N-3 are structurally ineligible, nasm_tier.go), so this will never
// need a third field.
//
// Tracks raw nusd_principal minted per tier, NOT SF_index-scaled debt and
// NOT collateral USD value -- mirrors NusdSupply.total_supply's own
// convention exactly (same reasoning nasm_accrual.go's AccrueStabilityFee
// doc comment gives for reusing TotalSupply as AYIS's totalBorrowed analog:
// per-vault SF_index scaling is applied at each vault's own read time via
// ScaledNusdDebt(), never stored as an absolute aggregate). Collateral USD
// value was considered and rejected as the tracked unit -- it would require
// a live price lookup at every mint_nusd cap check (this asset's price AND
// every other vault's original collateral price, to revalue the whole
// tier), turning a cheap accumulator comparison into an oracle-dependent,
// potentially stale calculation; NUSD principal is the unit
// Max_tier_share_bps's own spec text ("share of total NUSD supply") is
// actually about.
message NasmTierBacking {
  uint64 tier_n0_backing = 1; // raw nusd_principal minted against Tier N-0 (CNPY) collateral, summed
                               // across every open vault in that tier, 1e6 precision matching
                               // NusdSupply.total_supply
  uint64 tier_n1_backing = 2; // same as tier_n0_backing, for Tier N-1 (ARCM Tier 1 blue-chip)
}

// StabilityFeeIndex is the {32} record: the single global, RAY-scaled
// cumulative stability fee index, reusing AYIS's B_index/S_rate accrual
// pattern exactly (NASM Spec Section 6.2). NOT per-market/per-asset --
// one pooled fee across all NASM vaults, unlike AYIS's PrefixBorrowIndex/
// PrefixSupplyIndex which are keyed per lending market.
message StabilityFeeIndex {
  bytes  sf_index = 1;          // uint128, RAY-scaled, EncodeUint128 raw bytes -- same shape as
                                 // Market's B_index/loss_factor. Genesis value is RAY (1e18),
                                 // matching AYIS's SupplyIndexRecord initialization convention.
  uint64 last_accrual_block = 2; // mirrors Market.LastAccrualBlock's role (AYIS Section 7 Step 11) --
                                  // used to compute delta_t for AccrueStabilityFee's own compounding
                                  // step (NASM Spec Section 6.2). Global, not per-market: this is the
                                  // single pooled fee's own last-accrual point, not tied to any one
                                  // market's accrual cadence.
  bytes  remainder_ray = 3;      // uint128, RAY-scaled, EncodeUint128 raw bytes. Carries the
                                  // sub-RAY-unit remainder from feeEarned's division by RAY forward
                                  // to the next accrual call, mirroring Market.InterestRemainderRay's
                                  // exact fix (interest_accrual.go Step 7, ARCM/AYIS dust-loss fix)
                                  // for the identical failure class: without this, any accrual whose
                                  // numerator doesn't clear one full RAY unit has that fractional fee
                                  // silently and permanently discarded on every single call. Added
                                  // when AccrueStabilityFee was wired to actually credit {41} (NASM
                                  // Spec Section 6.4) instead of only compounding sf_index.
}

// RwaYieldVaultPosition is the {34} record: a single depositor's RWA Yield
// Vault share position (NASM Spec Section 8.2). Explicitly NOT NUSD and
// NOT 1:1 redeemable on demand -- a separate risk product, isolated from
// NUSD's own backing and redemption guarantee. Keyed by depositor address
// alone (KeyForRwaYieldVaultPosition), matching LenderPosition's precedent,
// since RYV positions are not transferable the way NasmVault is.
message RwaYieldVaultPosition {
  bytes  depositor = 1;
  uint32 asset_type = 2;      // 0 = RWA_FRACTION, 1 = NUSD (NASM Spec Section 8.2's
                               // deposit_yield_vault asset_type parameter)
  uint64 shares = 3;          // RYV share count, matching LenderPosition.shares' uint64 convention
  uint64 deposit_block = 4;   // matches LenderPosition.deposit_block's observability convention
}

// NusdBalance is the {35} record: a holder's independent NUSD balance,
// separate from Account.Amount (account.proto) -- Account.Amount is
// Canopy's single, undifferentiated native-currency balance per address
// (confirmed via KeyForAccount(addr) -- keyed by address alone, no asset
// dimension whatsoever). Every existing Arbor market's collateral_asset_id/
// debt_asset_id ("USDC", "ETH", etc.) is a pricing/tier LABEL only, never a
// separately-custodied on-chain balance -- all existing custody flows
// (deposit, borrow, withdraw, repay) move the SAME native-currency balance
// through Account.Amount/Pool.Amount regardless of which asset label a
// market names.
//
// NUSD cannot follow that pattern. It is the first asset Arbor itself
// issues, not a price-tracked pass-through -- crediting NusdAmountRequested
// into Account.Amount would be indistinguishable from inflating native
// currency supply under a different name, not real stablecoin issuance.
// NASM Consolidated Spec Section 10.2 additionally requires NUSD to be
// "fully permissionless" to hold and transfer independent of any vault
// action -- a requirement Account.Amount's single-denomination shape
// cannot satisfy at all. A dedicated, address-keyed ledger is therefore a
// structural requirement, not a convenience.
//
// KNOWN GAP, DISCLOSED: this message and its accessors provide balance
// storage and mint-time crediting only. A transfer_nusd (or equivalent
// send-style) message allowing arbitrary peer-to-peer NUSD movement,
// independent of mint_nusd/burn_nusd, does NOT exist yet -- Section 10.2's
// "universal, permissionless transfer" mandate is only partially met until
// that follow-up is built. A minted NUSD balance is real and correctly
// issued under this message, but not yet spendable to another address.
message NusdBalance {
  bytes  address = 1;
  uint64 amount = 2;
}

// EmergencyModeTrigger distinguishes an automatic (staleness-based) trigger
// from a manual risk-committee override -- ARCM Section 10's own text
// describes Emergency Mode as triggerable by "stale oracle beyond
// threshold, OR risk-committee override" (a superset condition), so the
// two causes are represented explicitly rather than collapsed into a
// single boolean, since a future reader/auditor needs to know WHY a given
// asset is in Emergency Mode, not just THAT it is.
enum EmergencyModeTrigger {
  EMERGENCY_TRIGGER_NONE = 0;       // not currently active
  EMERGENCY_TRIGGER_STALENESS = 1;  // automatic: no fresh price within EMERGENCY_THRESHOLD blocks
  EMERGENCY_TRIGGER_OVERRIDE = 2;   // manual: risk-committee-authorized override transaction
}

// EmergencyModeFlag is the {21} record: per-asset (NOT per-market -- see
// KeyForEmergencyMode's own doc comment in state_keys.go for why oracle
// trustworthiness is a canonical property of the asset's price feed,
// mirroring KeyForAssetTier/KeyForPriceRecord's identical asset-keyed
// precedent, not a market-specific concern) emergency-mode state.
//
// Read by OracleUntrustworthy() (oracle_untrustworthy.go), gating
// burn_nusd/liquidate_nasm_vault per NASM Consolidated Spec Section 9.2.
message EmergencyModeFlag {
  string               asset_id        = 1;
  bool                 active          = 2;
  EmergencyModeTrigger trigger         = 3;
  uint64               triggered_block = 4; // block height the flag was last set active; 0 if never triggered
  bytes                triggered_by    = 5; // authority address for TRIGGER_OVERRIDE; empty for TRIGGER_STALENESS
}

// CircuitBreakerState is the {20} record: per-asset (same asset-keyed
// rationale as EmergencyModeFlag above) circuit-breaker state.
//
// KNOWN GAP, DISCLOSED, NOT SILENT: the actual deviation-detection
// algorithm this state is meant to represent (ARCM Section 10 Rule 4 /
// MAX_PRICE_DEVIATION = 30%, immutable / TWAP_WINDOW) is NOT implemented.
// The base ARCM/AYIS spec's own audit trail lists "TWAP rolling window"
// as "OPEN (NF) / Deferred" -- this is not a case of an existing,
// fully-specified formula this codebase simply hasn't wired up yet (unlike
// every other gap closed this session); the upstream spec's own authors
// had not finished designing the comparison algorithm as of the documents
// this codebase was built against. Building a deviation-trigger algorithm
// here would mean inventing spec-level policy unilaterally and presenting
// it as ARCM-compliant, which this codebase's own established discipline
// (verify before act, no assumptions) treats as unacceptable. This message
// and its accessors (GetCircuitBreakerState/SetCircuitBreakerState) exist
// so {20} has a real reader/writer -- closing price_resolve.go's own
// disclosed "reserved key with no writer yet" gap at the STATE layer --
// but `active` will only ever be set by a manual override transaction
// (set_circuit_breaker, mirroring emergency mode's own override path)
// until a real TWAP/deviation algorithm is designed and approved. No
// automatic trigger exists for this flag as of this commit.
message CircuitBreakerState {
  string asset_id        = 1;
  bool   active           = 2;
  uint64 triggered_block  = 3;
  bytes  triggered_by     = 4; // authority address; always populated -- see this message's own doc comment, no automatic trigger exists yet
}

// ─────────────────────────────────────────────
// Faucet messages -- devnet-only testing tool. Dispenses BTC, ETH, USDC,
// and CNPY (test token, distinct from ARB, the chain's own native gas/
// staking token per chain.json) to a requesting address, gated by a 24h
// per-address-per-asset cooldown. State keys {37} (AssetBalance), {38}
// (FaucetClaimRecord).
// ─────────────────────────────────────────────

// AssetBalance is the {37} record: a generic, address+asset-keyed holding
// ledger for arbitrary market assets (btc, eth, usdc, CNPY, etc.) that,
// prior to this message, had no standalone wallet-style representation
// anywhere in this codebase -- only Account.Amount (the single native ARB
// balance) and NusdBalance (NUSD-specific) existed as address-keyed
// holdings. deposit_collateral and other handlers do not yet read or debit
// against this ledger (KNOWN GAP, DISCLOSED, tracked as a deliberate
// follow-up, not an oversight) -- as of this message, AssetBalance is
// faucet-credited and queryable, but not yet enforced as a spending
// balance anywhere else in the system.
message AssetBalance {
  bytes  address  = 1;
  string asset_id = 2;
  uint64 amount   = 3;
}

// FaucetClaimRecord is the {38} record: tracks the last block height a
// given address claimed a given asset from the faucet, enforcing the
// x_faucet_cooldown_blocks window (24h equivalent, expressed in blocks per
// this chain's own block time rather than wall-clock time, since
// DeliverTx handlers have no reliable wall-clock source -- mirrors every
// other staleness/cooldown check in this codebase, e.g.
// stalenessThresholdTable, all of which are block-height-based).
// Per-address-per-asset, not global -- an address may claim btc and eth
// the same day, just not the same asset twice within the cooldown window.
message FaucetClaimRecord {
  bytes  address           = 1;
  string asset_id          = 2;
  uint64 last_claim_block  = 3;
}
